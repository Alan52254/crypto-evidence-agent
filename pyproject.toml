[project]
name = "hoyabit-agent"
version = "0.1.0"
description = "可溯源的加密貨幣分析 Agent — ReAct 證據推理系統"
requires-python = ">=3.11,<3.13"
dependencies = [
    # 版本依 docs/research/0001-tech-stack-facts.md 鎖定。
    # mcp 必須寫死上界：2026-07-28 規格為破壞性改版，4 週內不得升 2.x。
    "langgraph==1.2.9",
    "langchain==1.3.14",
    "llama-index-core==0.14.23",
    "mcp==1.28.1",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]
vision = [
    "playwright>=1.48",
    "Pillow>=10.0",
]
export = [
    "reportlab>=4.2",
]

[project.scripts]
hoyabit-mcp = "hoyabit_agent.mcp_server:main"
hoyabit-eval = "hoyabit_agent.eval_cli:main"
hoyabit-web = "hoyabit_agent.viz.server:main"
hoyabit-ingest = "hoyabit_agent.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoyabit_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 讓 repo root 可匯入，使 `tests` 成為隱式命名空間套件 ——
# test_gaps / test_claim_ledger 以 `from tests.test_reliability import evidence_from`
# 共用輔助函式，少了這行整個套件無法 collect。
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "contract: 打真實外部 API 的契約測試，不進 CI 主流程",
    "postgres: 需要真實 Postgres 的測試；連不到資料庫時自動跳過",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# MCP SDK 的 @server.list_tools() / @server.call_tool() 裝飾器沒有型別註記。
# 只在這一個模組放寬這兩項，其餘全專案維持 strict。
[[tool.mypy.overrides]]
module = "hoyabit_agent.mcp_server"
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"
# 只 lint 自己的程式碼。.claude/skills/ 是外部技能包，不是本專案的一部分。
src = ["src", "tests"]
extend-exclude = [".claude", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
